version: "3.9"

services:
  web:
    image: nginx:1.27
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-conf:/etc/nginx/conf.d:ro
    depends_on:
      - api
    networks:
      - frontend

  api:
    image: node:20-alpine
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://db:5432/app
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
      - cache
    networks:
      - frontend
      - backend

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: hunter2
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend

  cache:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379/tcp"
    networks:
      - backend

  worker:
    image: myorg/worker:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api
      - cache
    networks:
      - backend

networks:
  frontend:
  backend:

volumes:
  db-data:
