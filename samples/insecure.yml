# A compose file that trips the security rules on purpose — useful for seeing
# what the linter flags. Do NOT use as a template.
services:
  # Reverse proxy that mounts the Docker socket (read-write!) — full host control.
  proxy:
    image: traefik:latest            # image-latest
    container_name: edge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # docker-socket-mount (error)
    ports:
      - "80:80"

  # "Monitoring" agent that throws isolation out the window.
  agent:
    image: monitoring-agent:latest
    container_name: edge             # duplicate-container-name (error) — proxy already claims it
    privileged: true                 # privileged (error)
    network_mode: host               # host-namespace
    pid: host                        # host-namespace
    cap_add:                         # no-new-privileges (warn) — caps without the security_opt
      - SYS_ADMIN                    # dangerous-cap (error)
      - NET_ADMIN                    # dangerous-cap (warn)
    security_opt:
      - seccomp:unconfined           # security-unconfined (error) — syscall filter off
    volumes:
      - /etc:/host-etc               # sensitive-host-mount (error) — read-write host config
      - /proc:/host-proc:ro          # sensitive-host-mount (warn) — read-only kernel surface

  # Database published to the world with a hardcoded password.
  db:
    image: postgres:16
    healthcheck:                     # defined… but see app's depends_on below
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
    environment:
      POSTGRES_PASSWORD: hunter2     # env-secret (error)
    ports:
      - "5432:5432"                  # port-public (warn) — on 0.0.0.0
    networks:
      - backend                      # undeclared-network (error) — no top-level networks block
    volumes:
      - pgdata:/var/lib/postgresql/data   # undeclared-volume (error) — no top-level volumes block

  # Locally-built app that receives a secret as a build arg — `docker history`
  # shows it to anyone who can pull the resulting image.
  app:
    command: sh -c "./serve --api-token sk-live-987654"   # command-secret (error) — visible in docker inspect / ps
    depends_on:
      - db                           # depends-on-ignores-healthcheck (warn) — db has a healthcheck, short form doesn't wait for it
      - cache                        # depends-on-unknown (error) — no such service here
    build:
      context: .
      args:
        API_TOKEN: sk-live-123456    # build-arg-secret (error)
    ports:
      - "80:8080"                    # port-conflict (error) — proxy already claims host port 80
