# A compose file that trips the security rules on purpose — useful for seeing
# what the linter flags. Do NOT use as a template.
services:
  # Reverse proxy that mounts the Docker socket (read-write!) — full host control.
  proxy:
    image: traefik:latest            # image-latest
    container_name: edge
    deploy:
      replicas: 2                    # container-name-with-replicas (error) — a fixed name can't be replicated
    depends_on:
      app:
        condition: service_healthy   # service-healthy-no-healthcheck (error) — app reports no health, this never starts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # docker-socket-mount (error)
    ports:
      - "80:80"

  # "Monitoring" agent that throws isolation out the window.
  agent:
    image: monitoring-agent:latest
    container_name: edge             # duplicate-container-name (error) — proxy already claims it
    privileged: true                 # privileged (error)
    oom_kill_disable: true           # oom-kill-disable (error) — no memory limit: host-hang on v1, silently discarded on v2
    user: root                       # explicit-root-user (warn) — overrides any USER the image drops to
    network_mode: host               # host-namespace
    networks:
      - backend                      # network-mode-with-networks (error) — mutually exclusive with network_mode
    ports:
      - "9100:9100"                  # ports-with-host-network (warn) — silently discarded under host networking
    pid: host                        # host-namespace
    cap_add:                         # no-new-privileges (warn) — caps without the security_opt
      - SYS_ADMIN                    # dangerous-cap (error)
      - NET_ADMIN                    # dangerous-cap (warn)
    security_opt:
      - seccomp:unconfined           # security-unconfined (error) — syscall filter off
    healthcheck:
      test: ["curl", "-f", "http://localhost:9100/health"]   # healthcheck-test-invalid (error) — list form needs CMD / CMD-SHELL / NONE first
    volumes:
      - /etc:/host-etc               # sensitive-host-mount (error) — read-write host config
      - /proc:/host-proc:ro          # sensitive-host-mount (warn) — read-only kernel surface
    devices:
      - /dev/sda:/dev/sda:r          # dangerous-device (error) — the raw disk IS the host fs, and :r doesn't soften it

  # Database published to the world with a hardcoded password.
  db:
    image: postgres:16
    mem_limit: 256m                  # a hard ceiling…
    mem_reservation: 512m            # mem-reservation-exceeds-limit (error) — soft floor above the ceiling; the daemon refuses to create it
    healthcheck:                     # defined… but see app's depends_on below
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s                  # healthcheck-no-start-period (warn) — boot failures count against retries
      timeout: 30s                   # healthcheck-timeout-exceeds-interval (warn) — "pg_isready was timing out, so I raised it":
                                     # interval is the PAUSE between probes, so a slow probe stretches the cycle to 40s and
                                     # unhealthy takes retries x that — and app's `condition: service_healthy` waits it out
    environment:
      POSTGRES_PASSWORD: hunter2     # env-secret (error)
      REPLICATION_PASSWORD: ${REPL_PASSWORD}   # secret-empty-when-unset (warn) — unset var interpolates to "" and `up` continues
    ports:
      - "5432:5432"                  # port-public (warn) — on 0.0.0.0
    networks:
      - backend                      # undeclared-network (error) — the top-level networks block doesn't declare it
    secrets:
      - db_root_password             # undeclared-secret (error) — no top-level secrets block
    volumes:
      - pgdata:/var/lib/postgresql/data   # undeclared-volume (error) — no top-level volumes block
      - pgbackup:/var/lib/postgresql/data # duplicate-mount-target (error) — same path twice, the daemon refuses the container

  # Metrics UI parked on an internal-only network: isolation done so well
  # that the published port below is never bound — Docker creates no host
  # mapping for a service whose every network is internal, and says nothing.
  metrics:
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3000:3000"        # ports-on-internal-network (warn) — the only network is internal, the mapping is dead
    pid: "service:app"               # shared-namespace (warn) — sees app's processes and reads its /proc/<pid>/environ
    ipc: "shareable"                 # shared-namespace (warn) — invites any container into its IPC namespace
    networks:
      - lockdown

  # Locally-built app that receives a secret as a build arg — `docker history`
  # shows it to anyone who can pull the resulting image.
  app:
    command: sh -c "./serve --api-token sk-live-987654"   # command-secret (error) — visible in docker inspect / ps
    environment:
      - LOG_LEVEL=debug
      - LOG_LEVEL=info                                    # duplicate-env-key (warn) — the second silently wins
    depends_on:
      - db                           # depends-on-ignores-healthcheck (warn) — db has a healthcheck, short form doesn't wait for it
      - cache                        # depends-on-unknown (error) — no such service here
    build:
      context: .
      args:
        API_TOKEN: sk-live-123456    # build-arg-secret (error)
    ports:
      - "80:8080"                    # port-conflict (error) — proxy already claims host port 80

networks:
  lockdown:
    internal: true                   # no route out — and, less famously, no port bindings in
